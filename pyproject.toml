[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-sparse-training"
version = "0.1.0"
description = "A first-principles neural network and dynamic sparse training library in pure Python 3.10+ and NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.6",
    "pytest>=7.0",
    "scikit-learn>=1.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
